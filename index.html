<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUVI User Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="portal-page">

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">

        <div class="home-card glass-card">

            <div class="brand-badge">
                <i class="bi bi-person-circle"></i>
            </div>

            <span class="welcome-tag">
                WELCOME TO GUVI
            </span>

            <h1 class="hero-title">
                User <span>Portal</span>
            </h1>

            <p class="hero-description">
                Your simple, secure and modern space to manage
                your personal profile.
            </p>

            <div class="portal-features">

                <div class="feature-item">
                    <i class="bi bi-shield-check"></i>
                    <span>Secure Access</span>
                </div>

                <div class="feature-item">
                    <i class="bi bi-person-check"></i>
                    <span>Easy Profile</span>
                </div>

                <div class="feature-item">
                    <i class="bi bi-phone"></i>
                    <span>Responsive</span>
                </div>

            </div>

            <div class="home-buttons">

                <a
                    href="register.html"
                    class="btn btn-primary portal-btn"
                >
                    <span>Create Account</span>
                    <i class="bi bi-arrow-right"></i>
                </a>

                <a
                    href="login.html"
                    class="btn btn-outline-light portal-outline-btn"
                >
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span>Login</span>
                </a>

            </div>

            <div class="home-footer">
                <i class="bi bi-lock-fill"></i>
                Secure &nbsp;•&nbsp; Simple &nbsp;•&nbsp; Reliable
            </div>

        </div>

    </div>

</body>
</html>
