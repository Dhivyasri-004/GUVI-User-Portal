<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - GUVI User Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="portal-page">

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-three"></div>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="form-card glass-card">

            <div class="form-header">

                <a href="index.html" class="back-home">
                    <i class="bi bi-arrow-left"></i>
                    Home
                </a>

                <div class="form-icon">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>

                <span class="form-tag">
                    WELCOME BACK
                </span>

                <h2>
                    Sign In
                </h2>

                <p>
                    Access your GUVI User Portal.
                </p>

            </div>

            <div id="message"></div>

            <!-- No normal form submission -->
            <form id="loginForm">

                <div class="mb-3">

                    <label for="email" class="form-label">
                        <i class="bi bi-envelope"></i>
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope input-icon"></i>

                        <input
                            type="email"
                            class="form-control modern-input"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>

                <div class="mb-4">

                    <label for="password" class="form-label">
                        <i class="bi bi-lock"></i>
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock input-icon"></i>

                        <input
                            type="password"
                            class="form-control modern-input"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>

                <button
                    type="button"
                    id="loginBtn"
                    class="btn btn-primary portal-btn w-100"
                >
                    <span>Sign In</span>
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <div class="secure-note">
                <i class="bi bi-shield-check"></i>
                Your login is securely protected.
            </div>

            <div class="form-divider">
                <span>New to GUVI Portal?</span>
            </div>

            <a
                href="register.html"
                class="secondary-action"
            >
                Create a new account
                <i class="bi bi-arrow-up-right"></i>
            </a>

        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/login.js"></script>

</body>
</html>
