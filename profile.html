<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - GUVI User Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="profile-page">

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <div class="container py-4 py-md-5">

        <div class="profile-card glass-card">

            <!-- Profile Header -->
            <div class="profile-header">

                <div class="profile-heading">

                    <div class="profile-avatar">
                        <i class="bi bi-person-fill"></i>
                    </div>

                    <div>
                        <span class="form-tag">
                            ACCOUNT
                        </span>

                        <h2>
                            My Profile
                        </h2>

                        <p>
                            Manage your personal information
                        </p>
                    </div>

                </div>

                <button
                    type="button"
                    id="logoutBtn"
                    class="btn logout-btn"
                >
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </button>

            </div>

            <div class="profile-divider"></div>

            <div id="message"></div>

            <!-- Account Information -->
            <div class="section-title">
                <i class="bi bi-person-badge"></i>
                <div>
                    <h5>Account Information</h5>
                    <p>Your registered account details</p>
                </div>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label for="name" class="form-label">
                        <i class="bi bi-person"></i>
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-person input-icon"></i>

                        <input
                            type="text"
                            class="form-control modern-input readonly-input"
                            id="name"
                            readonly
                        >

                    </div>

                </div>

                <div class="col-md-6 mb-3">

                    <label for="email" class="form-label">
                        <i class="bi bi-envelope"></i>
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope input-icon"></i>

                        <input
                            type="email"
                            class="form-control modern-input readonly-input"
                            id="email"
                            readonly
                        >

                    </div>

                </div>

            </div>

            <!-- Personal Information -->
            <div class="section-title mt-4">

                <i class="bi bi-person-lines-fill"></i>

                <div>
                    <h5>Personal Information</h5>
                    <p>Keep your profile information up to date</p>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label for="age" class="form-label">
                        <i class="bi bi-calendar3"></i>
                        Age
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-calendar3 input-icon"></i>

                        <input
                            type="number"
                            class="form-control modern-input"
                            id="age"
                            placeholder="Enter your age"
                        >

                    </div>

                </div>

                <div class="col-md-6 mb-3">

                    <label for="dob" class="form-label">
                        <i class="bi bi-calendar-date"></i>
                        Date of Birth
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-calendar-date input-icon"></i>

                        <input
                            type="date"
                            class="form-control modern-input"
                            id="dob"
                        >

                    </div>

                </div>

                <div class="col-md-6 mb-3">

                    <label for="contact" class="form-label">
                        <i class="bi bi-telephone"></i>
                        Contact Number
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-telephone input-icon"></i>

                        <input
                            type="tel"
                            class="form-control modern-input"
                            id="contact"
                            placeholder="Enter 10-digit number"
                        >

                    </div>

                </div>

                <div class="col-md-6 mb-3">

                    <label for="city" class="form-label">
                        <i class="bi bi-geo-alt"></i>
                        City
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-geo-alt input-icon"></i>

                        <input
                            type="text"
                            class="form-control modern-input"
                            id="city"
                            placeholder="Enter your city"
                        >

                    </div>

                </div>

                <div class="col-12 mb-4">

                    <label for="address" class="form-label">
                        <i class="bi bi-house"></i>
                        Address
                    </label>

                    <div class="input-wrapper textarea-wrapper">

                        <i class="bi bi-house input-icon textarea-icon"></i>

                        <textarea
                            class="form-control modern-input"
                            id="address"
                            rows="3"
                            placeholder="Enter your complete address"
                        ></textarea>

                    </div>

                </div>

            </div>

            <button
                type="button"
                id="updateBtn"
                class="btn btn-primary portal-btn w-100"
            >
                <span>Save Profile Changes</span>
                <i class="bi bi-check2-circle"></i>
            </button>

            <div class="profile-footer">
                <i class="bi bi-shield-check"></i>
                Your profile information is securely stored.
            </div>

        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/profile.js"></script>

</body>
</html>
